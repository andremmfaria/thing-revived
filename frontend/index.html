<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal // Car Thing</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="term-shell">

  <div class="tab-bar" id="tab-bar">
    <!-- populated from the agent's session_list message -->
  </div>

  <div class="screen-wrap">
    <div class="screen" id="screen" tabindex="0"></div>

    <!--
      Settings menu overlay (docs/research/settings-menu-feasibility.md §2):
      an in-page DOM layer inside #screen-wrap, not a separate page --
      toggled open/closed by the menu view (src/menu/menu-view.js) on KEY_ESC. Hidden by default via the
      .hidden class; the view adds/removes it, never touches display style
      directly, to keep this file the single source of the "what does
      hidden mean" rule.
    -->
    <div class="menu-overlay hidden" id="menu-overlay">
      <div class="menu-panel">
        <div class="menu-header">
          <span class="menu-title" id="menu-title">Settings</span>
          <span class="menu-close" id="menu-close">&times;</span>
        </div>
        <div class="menu-list" id="menu-list"></div>
        <!-- Wi-Fi password field (the menu view shows it only while editing on the
             password screen). Lives outside #menu-list so re-rendering the
             list never steals its focus. -->
        <div class="menu-input-wrap hidden" id="wifi-input-wrap">
          <input id="wifi-pass-input" type="password" autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false" maxlength="63" placeholder="Wi-Fi password">
        </div>
        <div class="menu-hint" id="menu-hint">knob: move \u00b7 push: select \u00b7 1: back \u00b7 esc: close</div>
      </div>
    </div>
    <div class="menu-toast hidden" id="menu-toast"></div>
  </div>

  <div class="status-bar">
    <span class="status-dot" id="agent-dot"></span>
    <span id="agent-text">AGENT: CONNECTING</span>
    <span class="status-sep">|</span>
    <span class="status-dot" id="bridge-dot"></span>
    <span id="bridge-text">BRIDGE: CONNECTING</span>
    <span class="status-sep">|</span>
    <span id="session-text">session: --</span>
    <div class="clock-widget" id="clock-widget">
      <span class="status-dot" id="clock-dot"></span>
      <span id="clock-text">--:--:--</span>
    </div>
  </div>

</div>

<!--
  Real xterm.js (vendored UMD build, frontend/vendor/) renders PTY output;
  see vendor/README.md for the version pinned and why a non-module classic
  <script> is required for a file:// page load.

  Every script below is a classic script (no ES modules, no bundler: the
  device runs Chromium 69 over file://) that attaches to the single global
  namespace window.TR. The order is the dependency order; boot.js is last and
  checks that everything it needs was loaded.
-->
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<!-- Generated from config/frontend.toml at image build time (the committed stub is empty = all defaults). -->
<script src="config.generated.js"></script>
<script src="src/utils/config.js"></script>
<script src="src/utils/logging.js"></script>
<script src="src/utils/types.js"></script>
<script src="src/core/module.js"></script>
<script src="src/core/bus.js"></script>
<script src="src/core/timers.js"></script>
<script src="src/wifi/wifi-logic.js"></script>
<script src="src/transport/channel.js"></script>
<script src="src/transport/agent-client.js"></script>
<script src="src/transport/bridge-client.js"></script>
<script src="src/state/store.js"></script>
<script src="src/state/reducers.js"></script>
<script src="src/state/selectors.js"></script>
<script src="src/input/buttons.js"></script>
<script src="src/interaction/events.js"></script>
<script src="src/interaction/machine.js"></script>
<script src="src/interaction/menu-chart.js"></script>
<script src="src/interaction/effects.js"></script>
<script src="src/menu/screens/root.js"></script>
<script src="src/menu/screens/bluetooth.js"></script>
<script src="src/menu/screens/terminal.js"></script>
<script src="src/menu/screens/timezone.js"></script>
<script src="src/menu/screens/wifi.js"></script>
<script src="src/menu/screens/index.js"></script>
<script src="src/menu/menu-view.js"></script>
<script src="src/wifi/picker-view.js"></script>
<script src="src/terminal/sessions.js"></script>
<script src="src/terminal/terminal-view.js"></script>
<script src="src/terminal/tabs-view.js"></script>
<script src="src/input/keyboard.js"></script>
<script src="src/input/focus.js"></script>
<script src="src/clock/clock.js"></script>
<script src="src/boot.js"></script>
</body>
</html>
