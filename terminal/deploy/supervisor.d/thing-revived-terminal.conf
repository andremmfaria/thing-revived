[program:thing-revived-terminal]
command=/opt/thing-revived/terminal-agent
numprocs=1
autorestart=true
autostart=true
startsecs=0
priority=96
redirect_stderr=true
stdout_logfile=/var/log/thing-revived-terminal.info
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
environment=TERMINAL_AGENT_CONFIG="/opt/thing-revived/terminal-agent-config.json"
