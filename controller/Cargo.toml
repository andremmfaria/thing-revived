[package]
name = "controller-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "controller_agent"
path = "src/lib.rs"

[[bin]]
name = "controller-agent"
path = "src/main.rs"

[dependencies]
# evdev reads raw Linux input_event records; works through the kernel's
# 32-bit-userspace-on-64-bit-kernel compat ABI since we're compiling armv7 (armhf).
evdev = "0.12"
# Sync, minimal WebSocket server/broadcast - no tokio runtime needed for this small demo.
tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# BlueZ D-Bus client + Agent1 object-export (settings-menu-feasibility.md §9.1 /
# bt-peripheral-pairing-workflow.md §4.2's recommended crate). Default features
# only (async-io's small bundled executor, no tokio) - zbus::blocking wraps that
# executor so call sites stay sync/threaded, matching this file's existing style.
zbus = "4"

[profile.release]
opt-level = "z"
lto = true
strip = true
