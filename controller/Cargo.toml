[package]
name = "controller-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "controller_agent"
path = "src/lib.rs"

[[bin]]
name = "controller-agent"
path = "src/main.rs"

[dependencies]
# evdev reads raw Linux input_event records; works through the kernel's
# kernel ABI; the binary is built for aarch64-unknown-linux-gnu, statically
# linked via crt-static (see build/build-image.sh).
evdev = "0.13"
# Sync, minimal WebSocket server/broadcast - no tokio runtime needed.
tungstenite = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared utils stack, identical versions and features in daemon/ (see src/utils).
# TOML config parsing; no `display` (we never write TOML) to keep the binary small.
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
# Logging facade plus a stderr backend (journald captures stderr). No color,
# humantime or regex features: the format is ours and filters are plain prefixes.
log = "0.4"
env_logger = { version = "0.11", default-features = false }
# BlueZ D-Bus client + Agent1 object-export (settings-menu-feasibility.md §9.1 /
# bt-peripheral-pairing-workflow.md §4.2's recommended crate). Default features
# only (async-io's small bundled executor, no tokio) - zbus::blocking wraps that
# executor so call sites stay sync/threaded, matching this file's existing style.
zbus = "6"

[profile.release]
opt-level = "z"
lto = true
strip = true
