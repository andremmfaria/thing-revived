[Unit]
# Installed as sshd.socket.d/20-thing-revived-ssh-gate.conf. Unit A writes
# /run/thing-revived/ssh-off when the persisted ssh setting is off. A failed condition leaves the
# socket inactive without marking the boot degraded. The controller removes the flag before any
# runtime start of sshd.socket, otherwise the start is a silent no-op.
After=thing-revived-device-settings.service
ConditionPathExists=/run/thing-revived/ssh-off
