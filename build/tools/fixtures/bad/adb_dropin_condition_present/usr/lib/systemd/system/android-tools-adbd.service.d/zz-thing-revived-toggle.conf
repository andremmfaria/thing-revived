[Unit]
ConditionPathExists=/etc/usb-debugging-enabled
Conflicts=thing-revived-usb-bind.service
After=thing-revived-usb-bind.service

[Service]
ExecStartPre=/bin/sh -c 'CFG=/sys/kernel/config/usb_gadget/superbird-kiosk; L="$CFG/configs/c.1/ffs.adb"; T="$CFG/functions/ffs.adb"; [ -L "$L" ] && exit 0; echo "" > "$CFG/UDC" 2>/dev/null || true; ln -s "$T" "$L"'
