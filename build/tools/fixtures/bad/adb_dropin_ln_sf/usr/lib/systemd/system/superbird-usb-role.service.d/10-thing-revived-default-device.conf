# Boot in USB device (gadget) mode by default, so the CDC-NCM dev link and SSH as kiosk exist.
#
# Upstream persists the boot role as the file /var/lib/superbird-usb-role/boot-role, but /var is a
# separate ext4 partition created empty on first boot (PARTLABEL=data, x-systemd.makefs), so the image
# cannot ship that file. This drop-in changes the default instead: device unless boot-role says "host".
#
# boot-role is a MIRROR of the Mode in /var/lib/thing-revived/device-settings.json, written at every
# boot by thing-revived-device-settings.service (unit A, Before= this unit), which is why this unit
# reads only that file. There is no build-flag branch any more: an ADB seeded build starts in device
# mode because the device settings loader forces adb off for host mode and applies the seed rule
# (docs/research/device-settings-plan.md sections 4.2 and 4.5), not because of a marker file.
#
# --no-revert is the same flag the stock unit uses for a persisted host role, so the 300 s
# auto-revert timer (systemd-run superbird-usb-role-revert) is never scheduled at boot.
[Unit]
# Run even when boot-role does not exist.
ConditionPathExists=
# Do not fail the unit if the nofail /var mount is missing; the role read below falls back to device.
Requires=
Wants=var.mount
# Set the role before adbd tries to bind the gadget UDC.
Before=android-tools-adbd.service

[Service]
ExecStart=
ExecStart=/bin/sh -c 'role="$(cat /var/lib/superbird-usb-role/boot-role 2>/dev/null || echo device)"; if [ "$role" = "host" ]; then exec /usr/bin/superbird-usb-role to-host --no-revert; else exec /usr/bin/superbird-usb-role to-device; fi'
