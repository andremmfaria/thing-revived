[Unit]
# Clear the upstream ConditionPathExists=/etc/usb-debugging-enabled (set by the superbird.conf
# drop-in this file is layered after). The marker is removed from every image
# (thing_revived_device_seed, superbird-kiosk-prod-image.bbappend) and adbd ships disabled:
# thing-revived-device-apply.service starts it at boot from the persisted ADB setting. A
# Condition here would make a runtime `systemctl start android-tools-adbd.service` (Device
# settings, USB mode) a silent no-op, which breaks the "works on every build" requirement.
ConditionPathExists=
Conflicts=thing-revived-usb-bind.service
After=thing-revived-usb-bind.service

[Service]
# thing-revived-usb-bind's `start` always removes this configfs link before binding the UDC
# NCM-only (it must: an incomplete FFS function makes the UDC bind fail with EBUSY). Re-create it
# here before adbd's own upstream ExecStartPost tries to bind the UDC again. This must not be a
# plain `ln -sf`: BusyBox ln -sf on a path that is already a symlink to a directory dereferences
# it and tries to create the link INSIDE that directory, which configfs refuses with EPERM (seen
# on-device on every boot, the superbird-usb-gadget.service run already leaves the link in place).
# So the link's presence is checked first and left alone if it is already there; only when it is
# missing (the state thing-revived-usb-bind's `start` leaves behind) is the UDC unbound first (a
# bound UDC with an incomplete FFS function cannot have functions re-linked under it) and the
# plain, non-dereferencing `ln -s` run.
ExecStartPre=/bin/sh -c 'CFG=/sys/kernel/config/usb_gadget/superbird-kiosk; L="$CFG/configs/c.1/ffs.adb"; T="$CFG/functions/ffs.adb"; [ -L "$L" ] && exit 0; echo "" > "$CFG/UDC" 2>/dev/null || true; ln -s "$T" "$L"'
