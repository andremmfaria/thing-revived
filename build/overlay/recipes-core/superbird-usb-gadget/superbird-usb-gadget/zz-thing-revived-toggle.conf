[Unit]
# Clear the upstream ConditionPathExists=/etc/usb-debugging-enabled (set by the superbird.conf
# drop-in this file is layered after). The marker is removed from every image
# (thing_revived_device_seed, superbird-kiosk-prod-image.bbappend) and adbd ships disabled:
# thing-revived-device-apply.service starts it at boot from the persisted ADB setting. A
# Condition here would make a runtime `systemctl start android-tools-adbd.service` (Device
# settings, USB mode) a silent no-op, which breaks the "works on every build" requirement.
ConditionPathExists=
Conflicts=thing-revived-usb-bind.service
After=thing-revived-usb-bind.service

[Service]
# thing-revived-usb-bind's `start` always removes this configfs link before binding the UDC
# NCM-only (it must: an incomplete FFS function makes the UDC bind fail with EBUSY). Re-create it
# here before adbd's own upstream ExecStartPost tries to bind the UDC again. -f makes this safe to
# run even when the link already exists (the first adbd start after boot, where
# superbird-usb-gadget.service created it already).
ExecStartPre=/bin/ln -sf /sys/kernel/config/usb_gadget/superbird-kiosk/functions/ffs.adb /sys/kernel/config/usb_gadget/superbird-kiosk/configs/c.1/ffs.adb
