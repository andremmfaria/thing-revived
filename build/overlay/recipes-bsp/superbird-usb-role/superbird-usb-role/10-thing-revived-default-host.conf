# Boot in USB host mode by default (needed for USB Wi-Fi/Ethernet/storage adapters).
#
# Upstream persists the boot role as the file /var/lib/superbird-usb-role/boot-role, but /var is a
# separate ext4 partition created empty on first boot (PARTLABEL=data, x-systemd.makefs), so the image
# cannot ship that file. This drop-in changes the default instead: host unless boot-role says "device".
# "superbird-usb-role persist device" therefore still works as the recovery switch, and "persist clear"
# or a fresh /var gives host.
#
# --no-revert is the same flag the stock unit uses for a persisted host role, so the 300 s
# auto-revert timer (systemd-run superbird-usb-role-revert) is never scheduled at boot.
[Unit]
# Run even when boot-role does not exist.
ConditionPathExists=
# Do not fail the unit if the nofail /var mount is missing; the role read below falls back to host.
Requires=
Wants=var.mount
# Set the role before adbd tries to bind the gadget UDC.
Before=android-tools-adbd.service

[Service]
ExecStart=
ExecStart=/bin/sh -c 'role="$(cat /var/lib/superbird-usb-role/boot-role 2>/dev/null || echo host)"; if [ "$role" = "device" ]; then exec /usr/bin/superbird-usb-role to-device; else exec /usr/bin/superbird-usb-role to-host --no-revert; fi'
