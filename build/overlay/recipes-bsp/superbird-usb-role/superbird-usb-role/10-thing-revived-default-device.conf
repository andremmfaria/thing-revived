# Boot in USB device (gadget) mode by default, so the CDC-NCM dev link and SSH as kiosk exist.
#
# Upstream persists the boot role as the file /var/lib/superbird-usb-role/boot-role, but /var is a
# separate ext4 partition created empty on first boot (PARTLABEL=data, x-systemd.makefs), so the image
# cannot ship that file. This drop-in changes the default instead: device unless boot-role says "host".
# "superbird-usb-role persist host" therefore opts in to host mode (USB Wi-Fi/Ethernet/storage
# adapters) from the next boot, and "persist clear" or a fresh /var gives device.
#
# Exception: ADB dev builds (THING_REVIVED_ENABLE_ADB=1) ship /etc/usb-debugging-enabled and adbd
# needs the gadget, so they always boot device, even when a persisted boot-role=host survives a
# reflash (/var is not rewritten). Production builds, without that file, honour the persisted host.
#
# --no-revert is the same flag the stock unit uses for a persisted host role, so the 300 s
# auto-revert timer (systemd-run superbird-usb-role-revert) is never scheduled at boot.
[Unit]
# Run even when boot-role does not exist.
ConditionPathExists=
# Do not fail the unit if the nofail /var mount is missing; the role read below falls back to device.
Requires=
Wants=var.mount
# Set the role before adbd tries to bind the gadget UDC.
Before=android-tools-adbd.service

[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -e /etc/usb-debugging-enabled ]; then exec /usr/bin/superbird-usb-role to-device; fi; role="$(cat /var/lib/superbird-usb-role/boot-role 2>/dev/null || echo device)"; if [ "$role" = "host" ]; then exec /usr/bin/superbird-usb-role to-host --no-revert; else exec /usr/bin/superbird-usb-role to-device; fi'
