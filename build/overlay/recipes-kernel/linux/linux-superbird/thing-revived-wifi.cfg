# USB Wi-Fi adapter support (host mode via a USB-C dock, see superbird-usb-role).
#
# This fragment must win over superbird-disable.cfg, which sets
# "# CONFIG_WLAN/CFG80211/MAC80211 is not set". linux-superbird_7.0.2.bb merges
# superbird.cfg, superbird-disable.cfg, superbird-usb-host.cfg first and then every
# other *.cfg in UNPACKDIR in glob (alphabetical) order, so this file is always
# merged after the disable fragment and the later assignment wins in merge_config.sh.
# All drivers are modules (.ko on the squashfs rootfs) to keep the boot Image small.

# --- wireless core: cfg80211 + mac80211 (mac80211 selects CRYPTO, AES, CCM, GCM, CMAC, ARC4, CRC32) ---
CONFIG_WLAN=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m
# cfg80211 depends on RFKILL || !RFKILL; RFKILL is already =y in the base config.
CONFIG_RFKILL=y
# LED class is a dependency of rtl8xxxu and enables LED support in rtw88/mt76/rt2x00.
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y

# mac80211 selects these as modules (it is =m). mac80211 requests "ccm(aes)", "gcm(aes)" and friends by name at runtime
# through the crypto API, which is not a symbol dependency, so depmod/RDEPENDS would never pull the .ko files in.
# Build them in so WPA2 (CCMP) and WPA3 (GCMP/CMAC/GMAC) cannot fail with a missing algorithm.
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_CCM=y
CONFIG_CRYPTO_GCM=y
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_CTR=y
CONFIG_CRYPTO_GHASH=y

# --- vendor menus (bool gates, default y, pinned so a future disable fragment cannot hide the drivers) ---
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_WLAN_VENDOR_MEDIATEK=y
CONFIG_WLAN_VENDOR_RALINK=y

# --- turn the other vendor menus off ---
# With CFG80211 disabled these were hidden, but the arm64 defconfig turns on drivers such as ATH10K, ATH11K,
# BRCMFMAC, MWIFIEX, WL18XX, RSI (which also re-enables BT_HCIRSI that superbird-disable.cfg turns off),
# WCN36XX and RTL_CARDS (rtlwifi). Enabling WLAN would build all of them. None are USB adapters we target,
# so drop the vendor gates and let kconfig prune the children.
# CONFIG_WLAN_VENDOR_ADMTEK is not set
# CONFIG_WLAN_VENDOR_ATH is not set
# CONFIG_WLAN_VENDOR_ATMEL is not set
# CONFIG_WLAN_VENDOR_BROADCOM is not set
# CONFIG_WLAN_VENDOR_INTEL is not set
# CONFIG_WLAN_VENDOR_INTERSIL is not set
# CONFIG_WLAN_VENDOR_MARVELL is not set
# CONFIG_WLAN_VENDOR_MICROCHIP is not set
# CONFIG_WLAN_VENDOR_PURELIFI is not set
# CONFIG_WLAN_VENDOR_QUANTENNA is not set
# CONFIG_WLAN_VENDOR_RSI is not set
# CONFIG_WLAN_VENDOR_SILABS is not set
# CONFIG_WLAN_VENDOR_ST is not set
# CONFIG_WLAN_VENDOR_TI is not set
# CONFIG_WLAN_VENDOR_ZYDAS is not set
# rtlwifi (PCI/USB RTL81xx) is defconfig =m inside the Realtek vendor menu; rtl8xxxu and rtw88 cover our targets.
# CONFIG_RTL_CARDS is not set

# --- Realtek rtw88 USB: D-Link DWA-171 rev A1 (RTL8811AU 2001:3314) and rev C1 (RTL8821CU 2001:331d) ---
CONFIG_RTW88=m
CONFIG_RTW88_8821AU=m
CONFIG_RTW88_8821CU=m
# Catch-all for other 802.11ac/n Realtek USB adapters supported by rtw88 in 7.0.2.
CONFIG_RTW88_8812AU=m
CONFIG_RTW88_8814AU=m
CONFIG_RTW88_8822BU=m
CONFIG_RTW88_8822CU=m
CONFIG_RTW88_8723DU=m

# --- MediaTek: D-Link DWA-171 rev B1 (MT7610U 2001:3d02) plus MT7612U and MT7601U dongles ---
CONFIG_MT76x0U=m
CONFIG_MT76x2U=m
CONFIG_MT7601U=m

# --- Ralink rt2800usb: RT2770/RT2870/RT3070/RT3071/RT3072/RT3370/RT3572/RT5370/RT5572 ---
CONFIG_RT2X00=m
CONFIG_RT2800USB=m
# RT2800USB_RT33XX and RT2800USB_RT35XX default to y. RT5370 (very common 150M dongle) needs RT53XX.
CONFIG_RT2800USB_RT33XX=y
CONFIG_RT2800USB_RT35XX=y
CONFIG_RT2800USB_RT3573=y
CONFIG_RT2800USB_RT53XX=y
CONFIG_RT2800USB_RT55XX=y

# --- Realtek rtl8xxxu: older 802.11n chips (RTL8188CU/8192CU/8723AU/8723BU/8192EU/8188EU/8188FU...) ---
CONFIG_RTL8XXXU=m
CONFIG_RTL8XXXU_UNTESTED=y
