# Installed to /etc/ssh/sshd_config.d/. The first value of a keyword wins, and
# "10-" sorts before the upstream 20-systemd-userdb.conf.
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
# UsePAM stays on: the account lock (usermod --expiredate 1) is enforced by the
# PAM account stack, also for key logins.
UsePAM yes
# First path: the key baked into the read-only image (kiosk only). Second path:
# the menu-managed key store on /var, outside the /etc overlay. Both stay
# readable when the overlay is down (degraded mode).
AuthorizedKeysFile /usr/share/thing-revived/accounts/%u.authorized_keys /var/lib/thing-revived-ssh/authorized_keys/%u
AuthorizedKeysCommand none
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
PermitUserEnvironment no
