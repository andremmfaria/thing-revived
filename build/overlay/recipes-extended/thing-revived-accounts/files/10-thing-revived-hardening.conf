# Installed to /etc/ssh/sshd_config.d/. The first value of a keyword wins, and
# "10-" sorts before the upstream 20-systemd-userdb.conf. Global default is key-only;
# only the kiosk user may use a password (set on first boot through the M button screen).
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
# UsePAM stays on: the account lock (usermod --expiredate 1) and pam_faillock are enforced by
# the PAM stack, also for the password method (it does not use keyboard-interactive).
UsePAM yes
# The menu-managed key store on /var, outside the /etc overlay. No key is baked into the image.
AuthorizedKeysFile /var/lib/thing-revived-ssh/authorized_keys/%u
AuthorizedKeysCommand none
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
PermitUserEnvironment no
# A Match block must stay last: everything after it would belong to it.
Match User kiosk
    PasswordAuthentication yes
    AuthenticationMethods password publickey
