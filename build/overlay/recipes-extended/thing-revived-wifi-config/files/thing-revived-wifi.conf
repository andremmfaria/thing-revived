# /var is the data partition (created at first boot), so this runs at boot rather than at image build.
# State directory is root-only; the wpa_supplicant config holds Wi-Fi passphrases in clear text.
d /var/lib/thing-revived 0700 root root -
# Created only if missing, so saved networks survive. update_config=1 lets SAVE_CONFIG persist networks.
f /var/lib/thing-revived/wpa_supplicant.conf 0600 root root - ctrl_interface=/run/wpa_supplicant\nupdate_config=1\n
