# NTP sources for systemd-timesyncd. The device has no RTC, so the clock is wrong at every boot
# until the first reply arrives. timesyncd watches systemd-networkd and queries as soon as any
# link (Wi-Fi or USB Ethernet) is online, then steps the clock on the first reply.
[Time]
NTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org
# Used when every NTP= server fails. The last two are anycast IP addresses, so they still work
# when DNS is not up yet.
FallbackNTP=time.cloudflare.com time.google.com 162.159.200.1 216.239.35.0
# Retry name resolution and connect failures sooner than the 30 s default, so a DHCP lease that
# arrives a moment after the link does not delay the first sync.
ConnectionRetrySec=10
