version: 2
updates:
  # Three independent Rust crates (no cargo workspace at the repo root), so
  # each needs its own cargo entry - dependabot does not recurse directories.
  - package-ecosystem: cargo
    directory: /prototype/control-surface/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /prototype/dashboard/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /terminal/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /prototype/control-surface/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Keeps the CI setup above (checkout/setup-node/rust-toolchain/cache
  # action versions) current too. directory must be "/" for github-actions -
  # dependabot knows to look in .github/workflows from there.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
