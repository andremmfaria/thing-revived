version: 2
updates:
  # Two independent Rust crates (no cargo workspace at the repo root), so each
  # needs its own cargo entry. Dependabot does not recurse directories.
  - package-ecosystem: cargo
    directory: /controller
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /daemon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # The frontend has no package.json (classic scripts, vendored xterm.js), so
  # there is no npm entry. Add one if a manifest is ever introduced.

  # Keeps the CI setup (checkout/setup-node/rust-toolchain/cache action
  # versions) current. directory must be "/" for github-actions: dependabot
  # looks in .github/workflows from there.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
