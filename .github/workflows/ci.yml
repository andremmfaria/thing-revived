name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each Rust crate below is a standalone Cargo.toml, not a cargo workspace
  # member - no shared workspace Cargo.toml exists at the repo root, so each
  # gets its own job with its own working-directory.
  control-surface-agent:
    name: control-surface agent (native build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/control-surface/agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            prototype/control-surface/agent/target
          key: ${{ runner.os }}-cargo-control-surface-${{ hashFiles('prototype/control-surface/agent/Cargo.lock') }}
      # This crate also cross-compiles to aarch64-unknown-linux-gnu for the
      # real device (see docs/yocto-build-and-flash.md §9), but that toolchain
      # is a local/devel-only concern - CI only validates the native x86_64
      # build, which is what the unit tests below actually run against.
      - run: cargo build --verbose
      - run: cargo test --verbose

  dashboard-agent:
    name: dashboard agent (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/dashboard/agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            prototype/dashboard/agent/target
          key: ${{ runner.os }}-cargo-dashboard-${{ hashFiles('prototype/dashboard/agent/Cargo.lock') }}
      - run: cargo build --verbose
      - run: cargo test --verbose

  terminal-agent:
    name: terminal agent (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal/agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            terminal/agent/target
          key: ${{ runner.os }}-cargo-terminal-${{ hashFiles('terminal/agent/Cargo.lock') }}
      - run: cargo build --verbose
      - run: cargo test --verbose

  control-surface-frontend:
    name: control-surface frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/control-surface/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototype/control-surface/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  terminal-frontend-syntax:
    name: terminal frontend (syntax check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # terminal/frontend is vanilla JS with no package.json/build step by
      # design (hand-edited, scp-deployed) - a syntax check is the most CI
      # should impose here, not a build pipeline it was never meant to have.
      - run: node --check terminal/frontend/app.js
