name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Only the actually-shipped components get CI (terminal/*, the real device
  # build). prototype/control-surface and prototype/dashboard are exploratory
  # and deliberately excluded - see docs/development.md for what's actually
  # running today vs. what's prototype-stage.
  terminal-agent:
    name: terminal agent (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal/agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            terminal/agent/target
          key: ${{ runner.os }}-cargo-terminal-${{ hashFiles('terminal/agent/Cargo.lock') }}
      - run: cargo build --verbose
      - run: cargo test --verbose

  terminal-frontend-syntax:
    name: terminal frontend (syntax check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # terminal/frontend is vanilla JS with no package.json/build step by
      # design (hand-edited, scp-deployed) - a syntax check is the most CI
      # should impose here, not a build pipeline it was never meant to have.
      - run: node --check terminal/frontend/app.js
