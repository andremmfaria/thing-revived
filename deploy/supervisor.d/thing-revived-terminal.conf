; Alternative to the systemd unit for hosts that run supervisord. Paths match
; the image: binary in /usr/bin, config in /etc/thing-revived (see config/README.md).
[program:thing-revived-terminal]
command=/usr/bin/terminal-agent
numprocs=1
autorestart=true
autostart=true
startsecs=0
priority=96
redirect_stderr=true
stdout_logfile=/var/log/thing-revived-terminal.info
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
environment=TERMINAL_AGENT_CONFIG="/etc/thing-revived/terminal-agent.toml"
